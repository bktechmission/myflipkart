<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" font-family="Helvetica, Arial, sans-serif">
<title>Sign-in and authorization</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="1500" height="560" fill="#ffffff"/>
<text x="30" y="46" font-size="28" font-weight="600" fill="#1e1e1e">Sign-in and authorization</text>
<text x="30" y="76" font-size="16" fill="#495057">OIDC code + PKCE, signed sessions, roles, ownership checked in the tools</text>
<rect x="20" y="100" width="1460" height="200" rx="14" fill="#dbe4ff" fill-opacity=".35" stroke="#dbe4ff"/>
<text x="32" y="124" font-size="16" fill="#495057">Authentication</text>
<rect x="40" y="150" width="260" height="110" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="170.0" y="200.68" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">Browser</text>
<text x="170.0" y="220.68" font-size="16" text-anchor="middle" fill="#1e1e1e">/login</text>
<rect x="350" y="150" width="320" height="110" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="510.0" y="191.65" font-size="15" font-weight="600" text-anchor="middle" fill="#1e1e1e">Google or MockID (OIDC)</text>
<text x="510.0" y="210.4" font-size="15" text-anchor="middle" fill="#1e1e1e">code + PKCE · state · nonce</text>
<text x="510.0" y="229.15" font-size="15" text-anchor="middle" fill="#1e1e1e">RS256 ID token</text>
<rect x="720" y="150" width="330" height="110" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="885.0" y="191.65" font-size="15" font-weight="600" text-anchor="middle" fill="#1e1e1e">/auth/callback</text>
<text x="885.0" y="210.4" font-size="15" text-anchor="middle" fill="#1e1e1e">verify issuer, audience,</text>
<text x="885.0" y="229.15" font-size="15" text-anchor="middle" fill="#1e1e1e">expiry, signature (JWKS)</text>
<rect x="1100" y="150" width="360" height="110" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="1280.0" y="191.65" font-size="15" font-weight="600" text-anchor="middle" fill="#1e1e1e">Signed HttpOnly cookie</text>
<text x="1280.0" y="210.4" font-size="15" text-anchor="middle" fill="#1e1e1e">cid · role · expiry</text>
<text x="1280.0" y="229.15" font-size="15" text-anchor="middle" fill="#1e1e1e">SameSite=Lax · Secure on https</text>
<rect x="20" y="330" width="1460" height="200" rx="14" fill="#ffe3e3" fill-opacity=".35" stroke="#ffe3e3"/>
<text x="32" y="354" font-size="16" fill="#495057">Authorization</text>
<rect x="40" y="380" width="330" height="120" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="205.0" y="426.65" font-size="15" font-weight="600" text-anchor="middle" fill="#1e1e1e">Roles</text>
<text x="205.0" y="445.4" font-size="15" text-anchor="middle" fill="#1e1e1e">guest · customer · seller · admin</text>
<text x="205.0" y="464.15" font-size="15" text-anchor="middle" fill="#1e1e1e">(ADMIN_EMAILS, SELLER_ACCOUNTS)</text>
<rect x="400" y="380" width="330" height="120" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="565.0" y="417.35" font-size="15" font-weight="600" text-anchor="middle" fill="#1e1e1e">Middleware</text>
<text x="565.0" y="436.1" font-size="15" text-anchor="middle" fill="#1e1e1e">withAuth: 401 / 403</text>
<text x="565.0" y="454.85" font-size="15" text-anchor="middle" fill="#1e1e1e">X-Sauby CSRF header on writes</text>
<text x="565.0" y="473.6" font-size="15" text-anchor="middle" fill="#1e1e1e">rate limits per session/IP</text>
<rect x="760" y="380" width="330" height="120" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="925.0" y="426.65" font-size="15" font-weight="600" text-anchor="middle" fill="#1e1e1e">Ownership in the tools</text>
<text x="925.0" y="445.4" font-size="15" text-anchor="middle" fill="#1e1e1e">own orders, chats, photos only</text>
<text x="925.0" y="464.15" font-size="15" text-anchor="middle" fill="#1e1e1e">other customers&#x27; ids → 404</text>
<rect x="1120" y="380" width="340" height="120" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="1290.0" y="417.35" font-size="15" font-weight="600" text-anchor="middle" fill="#1e1e1e">ReviewGuard</text>
<text x="1290.0" y="436.1" font-size="15" text-anchor="middle" fill="#1e1e1e">review own delivered orders only</text>
<text x="1290.0" y="454.85" font-size="15" text-anchor="middle" fill="#1e1e1e">sellers: general terms, no identity</text>
<text x="1290.0" y="473.6" font-size="15" text-anchor="middle" fill="#1e1e1e">no moderating your own seller</text>
<line x1="300" y1="205" x2="350" y2="205" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<line x1="670" y1="205" x2="720" y2="205" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<line x1="1050" y1="205" x2="1100" y2="205" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<line x1="1280" y1="260" x2="220" y2="380" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a)"/>
</svg>